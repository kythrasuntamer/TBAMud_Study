name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install static analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy libsodium-dev

    - name: Enforce error-locality logging
      run: sh tools/check_error_locality.sh


    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTATIC_ANALYSIS=ON

    - name: Build with clang-tidy
      shell: bash
      run: |
        set -o pipefail
        cmake --build build --parallel 2>&1 | tee build.log

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: ${{ always() && hashFiles('build.log') != '' }}
      with:
        name: build-log
        path: build.log

    - name: Test
      run: |
        mkdir -p tests/test-results
        ctest --test-dir build --output-on-failure \
          --output-junit "$GITHUB_WORKSPACE/tests/test-results/ctest.xml"

    - name: Python regression contracts
      shell: bash
      run: |
        set -o pipefail
        # This branch's class/guild contracts only: many older contract scripts
        # expect argv/env from their ctest wrappers, so a bare 'unittest
        # discover' over tests/ already fails on master.
        python3 -m unittest -v tests.test_arcane_class_specializations \
          tests.test_class_conversion_safety tests.test_midgaard_seven_guilds \
          tests.test_new_class_progression tests.test_original_class_extended_skills \
          tests.test_trigger_class_names_contract tests.test_zone301_room_order \
          2>&1 | tee python-tests.log

    - name: Verify world syntax
      shell: bash
      run: |
        set -o pipefail
        ./bin/circle -c -d lib 2>&1 | tee world-syntax.log
        if grep -E 'SYSERR: zone file: Invalid vnum|offending cmd:' world-syntax.log; then
          echo "World-data reset validation failed" >&2
          exit 1
        fi

    - name: Upload verification logs
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: verification-logs
        path: |
          python-tests.log
          world-syntax.log
        if-no-files-found: ignore

    - name: Publish test results
      uses: dorny/test-reporter@v2
      if: ${{ always() && hashFiles('tests/test-results/*.xml') != '' }}
      with:
        name: Unity Tests
        path: tests/test-results/*.xml
        reporter: java-junit
