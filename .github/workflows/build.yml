name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install static analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTATIC_ANALYSIS=ON

    - name: Build with clang-tidy
      shell: bash
      run: |
        set -o pipefail
        cmake --build build --parallel 2>&1 | tee build.log

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: ${{ always() && hashFiles('build.log') != '' }}
      with:
        name: build-log
        path: build.log

    - name: Test
      run: |
        mkdir -p tests/test-results
        ctest --test-dir build --output-on-failure \
          --output-junit "$GITHUB_WORKSPACE/tests/test-results/ctest.xml"

    - name: Publish test results
      uses: dorny/test-reporter@v2
      if: ${{ always() && hashFiles('tests/test-results/*.xml') != '' }}
      with:
        name: Unity Tests
        path: tests/test-results/*.xml
        reporter: java-junit
