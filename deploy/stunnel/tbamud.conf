; TLS 1.3-only frontend. Replace cert and key paths with your deployment paths.
; Certificate must chain to a CA trusted by clients (e.g. Let's Encrypt).
foreground = yes
client = no
sslVersionMin = TLSv1.3
sslVersionMax = TLSv1.3
; Standard authenticated encryption; Serpent is not defined for TLS 1.3.
ciphersuites = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
; Do not use protocols or clients that lack authenticated TLS 1.3 support.
; Limit sockets to prevent slow-client resource exhaustion; tune operationally.
TIMEOUTidle = 300
TIMEOUTclose = 5

[mud-tls]
accept = 0.0.0.0:5001
connect = 127.0.0.1:5000
cert = /etc/ssl/tbamud/fullchain.pem
key = /etc/ssl/tbamud/privkey.pem
